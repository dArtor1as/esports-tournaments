name: Backend and Frontend CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  prettier-and-build:
    runs-on: ubuntu-latest

    # всі команди треба виконувати в папці backend
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Install dependencies
        run: npm install
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Check Code Formatting (Prettier)
        run: npm run format:check
      - name: Run ESLint
        run: npm run lint
      - name: Build Project
        run: npm run build

  frontend-prettier-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install dependencies
        run: npm install
      - name: Check Code Formatting (Prettier)
        run: npm run format:check
      - name: Build Frontend
        run: npm run build
